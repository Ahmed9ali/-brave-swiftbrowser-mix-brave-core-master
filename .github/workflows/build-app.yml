name: Build SwiftBrowser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The APK is built from the SwiftBrowser app project, not from this
      # brave-core overlay. Check the app repo out into a subdirectory.
      - name: Checkout SwiftBrowser app
        uses: actions/checkout@v4
        with:
          repository: Ahmed9ali/braveads-swiftbrowser
          ref: main
          path: swiftbrowser

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---- native ad-blocking engine (Rust, same engine Brave uses) ----
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swiftbrowser/rust/swift_adblock

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Test engine
        working-directory: swiftbrowser/rust/swift_adblock
        run: cargo test --release

      - name: Build libswift_adblock.so
        working-directory: swiftbrowser/rust/swift_adblock
        env:
          # 16 KB page alignment (required on Android 15+ devices with 16 KB pages)
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../../app/src/main/jniLibs build --release
          ls -la ../../app/src/main/jniLibs/*/libswift_adblock.so

      # ---- app ----
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate wrapper
        working-directory: swiftbrowser
        run: gradle wrapper --gradle-version 8.13

      - name: Build debug APK
        working-directory: swiftbrowser
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "swiftbrowser/**/build/outputs/apk/debug/*.apk"
